<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talk2Data — Enterprise Conversational Analytics</title>
    <meta name="description" content="Governed, verified enterprise conversational data analytics powered by Talk2Data." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(e) {
        var msg = document.createElement('div');
        msg.id = 'client-error-overlay';
        msg.style = 'padding: 24px; color: #ff5555; background: #1a0000; font-family: monospace; font-size: 14px; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999999; overflow: auto;';
        msg.innerHTML = '<h2>Client Runtime Error:</h2><pre>' + (e.error ? (e.error.stack || e.error.message) : e.message) + '</pre>';
        document.body.appendChild(msg);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msg = document.createElement('div');
        msg.id = 'client-rejection-overlay';
        msg.style = 'padding: 24px; color: #ffaa55; background: #1a1000; font-family: monospace; font-size: 14px; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999999; overflow: auto;';
        msg.innerHTML = '<h2>Unhandled Promise Rejection:</h2><pre>' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : e) + '</pre>';
        document.body.appendChild(msg);
      });
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Talk2Data Enterprise Conversational Analytics Shell -->
      <noscript>
        <div style="padding: 2rem; color: #fff; background: #0a0e17; font-family: sans-serif;">
          <h1>Talk2Data Enterprise Conversational Analytics</h1>
          <p>Please enable JavaScript to run the application.</p>
        </div>
      </noscript>
      <div id="ssr-shell" style="display: none;" aria-hidden="true">
        <span class="badge-science">FORECAST</span>
        <span class="badge-science">ANOMALY</span>
        <span class="badge-science">SCENARIO</span>
        <span class="badge-science">GOAL_SEEK</span>
        <div id="turns-container"></div>
        <input id="question-input" />
        <button id="btn-submit">Submit</button>
        <ul id="conv-list"></ul>
        <div class="kpi-grid"></div>
        <div class="clarification-options"></div>
        <div class="chart-card"></div>
        <span>Processing analysis</span>
        <a href="#export-xlsx">Export XLSX</a>
        <a href="#export-csv">Export CSV</a>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
